[project]
name = "paythos"
version = "0.1.0"
description = "Paythos Protocol Python SDK: EIP-712 voucher signer, x402 v2 client, FastAPI merchant middleware, CrewAI / LangChain adapters."
requires-python = ">=3.10"
license = { text = "GPL-3.0" }
dependencies = [
    "eth-account>=0.11",
    "pydantic>=2.6",
    "httpx>=0.27",
]

[project.optional-dependencies]
fastapi = ["fastapi>=0.110"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "fastapi>=0.110",
    "respx>=0.21",
    "crewai>=0.30; python_version >= '3.10'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["paythos"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
